name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, invariants, static checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Static security analysis (bandit)
        run: bandit -q -r app

      - name: Migrations apply to an empty database
        env:
          TALIMGO_DATABASE_URL: sqlite:///./ci-migration-test.db
        run: alembic upgrade head

      - name: Tests (unit, API, learning invariants, local-AI policy)
        env:
          TALIMGO_ENV: test
          TALIMGO_DATABASE_URL: sqlite:///./ci-test.db
        run: pytest -q

      - name: Offline local-model integration test (skips when no runtime is installed)
        env:
          TALIMGO_ENV: test
          TALIMGO_DATABASE_URL: sqlite:///./ci-test.db
        run: pytest -q -m local_model -rs

  forbidden-ai-scan:
    name: Hosted-AI prohibition scan (code and manifests only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan application code and dependency manifests
        run: |
          set -euo pipefail
          echo "Scanning application code and manifests for hosted generative-AI providers..."
          PATTERN='openai|anthropic|generativelanguage|google[._-]generativeai|vertexai|cohere|mistralai|groq|together[._-]?xyz|replicate|huggingface_hub|bedrock|api\.gemini'
          TARGETS=(backend/app backend/tests frontend/src backend/pyproject.toml frontend/package.json)
          # The policy module and its test legitimately name the forbidden providers when enforcing the ban.
          MATCHES=$(grep -rInE "$PATTERN" "${TARGETS[@]}" \
            --exclude='policy.py' \
            --exclude='test_ai_local_only.py' \
            --exclude='package-lock.json' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Hosted AI provider reference found in code or manifests (AGENTS.md §2)."
            exit 1
          fi
          echo "Clean: no hosted AI provider references in code or manifests."

      - name: Fail if a forbidden provider SDK is declared as a dependency
        run: |
          set -euo pipefail
          FORBIDDEN='openai|anthropic|google-generativeai|google-genai|cohere|mistralai|groq|replicate|litellm'
          if grep -nE "^[[:space:]]*\"?($FORBIDDEN)" backend/pyproject.toml; then
            echo "::error::Forbidden AI SDK declared in backend/pyproject.toml"
            exit 1
          fi
          if python3 -c "
import json,sys
deps=json.load(open('frontend/package.json')).get('dependencies',{})
bad=[d for d in deps if any(k in d for k in ('openai','anthropic','@google/generative-ai','cohere-ai','mistral','groq-sdk','replicate'))]
sys.exit(1 if bad else 0)
"; then echo "Clean: no forbidden SDK in frontend dependencies."; else echo "::error::Forbidden AI SDK in frontend/package.json"; exit 1; fi

  frontend:
    name: Frontend (build, type-check, component tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test -- --run

  dependency-audit:
    name: Dependency and licence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --progress-spinner off || true
      - name: Node audit and licence inventory
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev || true
          npx --yes license-checker --summary --production || true
