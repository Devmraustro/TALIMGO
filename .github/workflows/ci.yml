name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, invariants, static checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Static security analysis (bandit)
        run: bandit -q -r app

      - name: Migrations apply to an empty database, and match the models
        env:
          TALIMGO_ENV: test
          TALIMGO_DATABASE_URL: sqlite:///./ci-migration-test.db
        run: |
          alembic upgrade head
          alembic check

      - name: Tests (unit, API, learning invariants, local-AI policy)
        env:
          TALIMGO_ENV: test
          TALIMGO_DATABASE_URL: sqlite:///./ci-test.db
        run: pytest -q

      - name: Offline local-model integration test (skips when no runtime is installed)
        env:
          TALIMGO_ENV: test
          TALIMGO_DATABASE_URL: sqlite:///./ci-test.db
        run: pytest -q -m local_model -rs

  postgres-integration:
    name: PostgreSQL (migrations, startup and persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talimgo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talimgo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TALIMGO_ENV: test
      TALIMGO_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/talimgo
      TALIMGO_SESSION_SECRET: postgres-ci-session-secret-change-this
      TALIMGO_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migration chain and check schema drift
        run: |
          alembic upgrade head
          alembic check

      - name: Smoke-test startup, account/session and goal persistence on PostgreSQL
        run: python scripts/postgres_smoke.py

  local-only-ai:
    name: Local-only AI gate (no hosted providers in code or manifests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source and manifest check
        run: python scripts/check_no_external_ai.py

  frontend:
    name: Frontend (typecheck, build, component tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests (the live-stack UI smoke test self-skips here)
        run: npm test -- --run

  dependency-audit:
    name: Dependency and licence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python vulnerability audit
        working-directory: backend
        run: |
          # Upgrade the environment's own build tooling first: pip-audit otherwise reports the
          # interpreter's seeded pip/setuptools, which are not TALIMGO's dependencies.
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pip-audit
          pip install -e .
          pip-audit --progress-spinner off

      - name: Python licence policy
        working-directory: backend
        run: python scripts/check_licences.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node vulnerability audit and licence policy
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev
          node scripts/check-licences.mjs
