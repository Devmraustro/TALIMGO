# TALIMGO development stack: PostgreSQL + FastAPI + Vite.
#
# Start:  docker compose -f docker-compose.dev.yml up --build -d
# Stop:   docker compose -f docker-compose.dev.yml down
# Reset:  docker compose -f docker-compose.dev.yml down -v  (deletes learner data)
#
# The backend applies Alembic migrations before starting. Startup then loads the authored
# curriculum (2 paths, 20 objectives, 20 lessons, 68 items, 2 projects) in development mode.
name: talimgo-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talimgo
      POSTGRES_USER: talimgo
      POSTGRES_PASSWORD: talimgo_dev
    ports:
      - "5432:5432"
    volumes:
      - talimgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      TALIMGO_ENV: development
      TALIMGO_DATABASE_URL: postgresql+psycopg://talimgo:talimgo_dev@db:5432/talimgo
      TALIMGO_SESSION_SECRET: dev-only-docker-session-secret-change-me
      TALIMGO_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TALIMGO_AI_ENABLED: "false"
    ports:
      - "8000:8000"
    # The whole repository is mounted, not just backend/: backend tests resolve the repository
    # root above them to read deploy/, .github/, docs/ and frontend/package.json, exactly as CI
    # does on a full checkout. The backend package lives at /app/backend, which is also the
    # directory the container starts in (see working_dir below).
    volumes:
      - .:/app
    working_dir: /app/backend
    # Test databases live under /tmp. The container's writable layer is extremely slow for the
    # many small SQLite fsyncs in this environment; tmpfs keeps `docker exec ... pytest` fast.
    tmpfs:
      - /tmp:size=512m
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Vite proxies /api to this target, so the browser keeps same-origin cookies.
      TALIMGO_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    # Same repository-root layout as the backend: frontend tests read deploy/nginx/,
    # frontend/vercel.json, the root vercel.json and middleware.ts. node_modules stays in a
    # container-only volume so Windows host binaries are never executed by Linux Node.
    volumes:
      - .:/app
      - talimgo_frontend_modules:/app/frontend/node_modules
    working_dir: /app/frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  talimgo_pgdata:
  talimgo_frontend_modules:
