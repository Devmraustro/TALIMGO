[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talimgo-backend"
version = "0.1.0"
description = "TALIMGO backend: curriculum, deterministic learning engine, local-only AI tutor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "local_model: requires a real local model runtime (skipped when unavailable)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI dependency injection uses function calls in defaults
    "RUF001", # en dashes and Arabic punctuation are intentional in authored prose
]

[tool.ruff.lint.per-file-ignores]
# Authored curriculum prose legitimately has long lines; it is content, not code shape.
"app/curriculum/*.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/curriculum/*"]
